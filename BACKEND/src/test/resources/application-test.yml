spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never # turn off data.sql seeding in test memory db if it conflicts, or keep it. Let's keep it "never" so tests seed manually and are clean.
  flyway:
    enabled: false

# The test profile reads the signing key from the environment as well.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 100000
