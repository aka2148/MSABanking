openapi: 3.0.3
info:
  title: BankingTechnology Login Service API
  version: 1.0.0
  description: |
    Public API contract for the Login Module in the BankingTechnology microservices platform.

    The Login Module owns session and token issuance. It does not access user_db directly.
    Identity, credentials, account status, roles, verified contacts, login-attempt tracking,
    and password operations are delegated to the User Service over a secured service-to-service
    channel.

    Authentication failures intentionally use the same response for an unknown user, an invalid
    password, a locked account, and a suspended account to prevent user enumeration.
  contact:
    name: BankingTechnology Platform Team
  license:
    name: Internal API Contract
servers:
  - url: https://api.example.com
    description: Production
  - url: https://sandbox-api.example.com
    description: Sandbox

tags:
  - name: Login
    description: Username/password and MFA login flows
  - name: Sessions
    description: Session validation, refresh, and logout
  - name: Account
    description: Pre-login account status
  - name: Password
    description: Password change and reset flows
  - name: OTP
    description: OTP-first login flows

paths:
  /auth/login:
    post:
      tags: [Login]
      operationId: startLogin
      summary: Start username/password login
      description: |
        Validates credentials through the User Service. If MFA is disabled, returns a LoginSession.
        If MFA is enabled, returns MFA_REQUIRED and a challengeId. Invalid credentials and account
        restrictions return the same 401 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              passwordLogin:
                value:
                  username: alex.smith
                  password: ExamplePassword123!
      responses:
        '200':
          description: Login accepted or MFA required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSession'
                  - $ref: '#/components/schemas/MfaRequired'
              examples:
                sessionIssued:
                  value:
                    accessToken: eyJhbGciOiJIUzUxMiJ9...
                    refreshToken: 7d4a1f...
                    tokenType: Bearer
                mfaRequired:
                  value:
                    status: MFA_REQUIRED
                    challengeId: 9d7e8a2b-4a75-4cc2-881c-98f8d2e8cb0a
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/login/mfa/challenge:
    post:
      tags: [Login]
      operationId: sendMfaChallenge
      summary: Send an MFA OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: MFA OTP accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/login/mfa/verify:
    post:
      tags: [Login]
      operationId: verifyMfa
      summary: Verify MFA OTP and issue a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: MFA verified and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/token/refresh:
    post:
      tags: [Sessions]
      operationId: refreshToken
      summary: Rotate a refresh token
      description: The submitted refresh token is invalidated and replaced with a new access/refresh token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/logout:
    post:
      tags: [Sessions]
      operationId: logout
      summary: Invalidate the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/session:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Validate the current access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetails'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/account-status:
    get:
      tags: [Account]
      operationId: getAccountStatus
      summary: Check account restrictions before login
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Account restriction flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/password/change:
    post:
      tags: [Password]
      operationId: changePassword
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          description: Password policy or reuse violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/password/forgot:
    post:
      tags: [Password]
      operationId: requestPasswordReset
      summary: Request a password reset
      description: |
        Always returns 202 for a syntactically valid request. The implementation must not reveal
        whether the username exists. The User Service issues and delivers the reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
      responses:
        '202':
          description: Reset request accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/password/reset:
    post:
      tags: [Password]
      operationId: resetPassword
      summary: Complete a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password reset completed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          description: Password policy or reuse violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/otp/send:
    post:
      tags: [OTP]
      operationId: sendOtp
      summary: Start OTP-first login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: OTP accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /auth/otp/verify:
    post:
      tags: [OTP]
      operationId: verifyOtpLogin
      summary: Verify OTP-first login and issue a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Login Module access token. Send as `Authorization: Bearer <accessToken>`.'

  parameters:
    UserId:
      name: userId
      in: query
      required: true
      description: User Service identity identifier.
      schema:
        type: string
        minLength: 1
        example: usr_01HX7K2P4Y

  responses:
    AuthenticationFailed:
      description: Authentication failed. Does not distinguish user-not-found, wrong-password, locked, or suspended states.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-04T12:00:00Z'
            status: 401
            error: Unauthorized
            message: Authentication failed
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserServiceUnavailable:
      description: User Service is unavailable or the circuit breaker is open.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-04T12:00:00Z'
            status: 503
            error: Service Unavailable
            message: Authentication service is temporarily unavailable

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true

    MfaChallengeRequest:
      type: object
      required: [userId, username, destination]
      properties:
        userId:
          type: string
        username:
          type: string
        destination:
          type: string
          description: Verified destination selected by the User Service.
          example: masked-email-or-phone

    OtpSendRequest:
      type: object
      required: [userId, username]
      properties:
        userId:
          type: string
        username:
          type: string
        channel:
          type: string
          enum: [EMAIL, PHONE]
          default: EMAIL

    OtpVerifyRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          writeOnly: true

    LoginSession:
      type: object
      required: [accessToken, refreshToken, tokenType]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token.
        refreshToken:
          type: string
          writeOnly: true
          description: Rotating refresh token.
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer

    MfaRequired:
      type: object
      required: [status, challengeId]
      properties:
        status:
          type: string
          enum: [MFA_REQUIRED]
        challengeId:
          type: string
          format: uuid

    OtpSentResponse:
      type: object
      required: [challengeId, status]
      properties:
        challengeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OTP_SENT]

    SessionDetails:
      type: object
      required: [active, userId, username, roles]
      properties:
        active:
          type: boolean
          example: true
        userId:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
          example: [ROLE_CUSTOMER]

    AccountStatus:
      type: object
      required: [locked, suspended, mustChangePassword]
      properties:
        locked:
          type: boolean
        suspended:
          type: boolean
        mustChangePassword:
          type: boolean

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    UsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255

    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string

x-internal-user-service:
  description: |
    These calls are internal only and must not be published as public Login Service endpoints.
    They must use mTLS or a signed service token and network policy restricting access to the
    Login Service workload. Configure the Login Service with USER_SERVICE_URL and
    USER_SERVICE_SERVICE_TOKEN; do not configure a database connection to user_db.
  transport:
    authentication: Signed service token in Authorization header
    timeoutMs: 2000
    maxRetries: 2
    circuitBreaker:
      failureThreshold: 3
      openDurationMs: 30000
  operations:
    - method: POST
      path: /internal/users/validate-credentials
      purpose: Verify username and password and return identity plus MFA flag.
    - method: GET
      path: /internal/users/{id}/account-status
      purpose: Return locked, suspended, and must-change-password flags.
    - method: POST
      path: /internal/users/{id}/unlock
      purpose: Clear a lockout.
    - method: GET
      path: /internal/users/{id}/roles
      purpose: Return roles for session claims.
    - method: GET
      path: /internal/users/{id}/contacts
      purpose: Return verified email and phone destinations.
    - method: POST
      path: /internal/users/{id}/login-attempts
      purpose: Record login success/failure and last-login metadata.
    - method: POST
      path: /internal/users/{id}/password/change
      purpose: Delegate password change and reuse checks.
    - method: POST
      path: /internal/password/forgot
      purpose: Issue a password reset token without revealing account existence.
    - method: POST
      path: /internal/password/reset
      purpose: Complete password reset.
