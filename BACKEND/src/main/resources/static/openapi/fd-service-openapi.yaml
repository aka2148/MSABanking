openapi: 3.0.3
info:
  title: FD (Fixed Deposit) Service API
  description: >
    API contract for the Fixed Deposit microservice (owns database: fd_db).
    Covers FD account lifecycle, holders, transactions, interest accrual/payout,
    premature closure, maturity instructions, notices/statements, account events,
    and internal reference-data sync from upstream services (User, Product, Currency).
  version: 1.0.0
servers:
  - url: https://api.example.com/fd/v1
    description: Production
  - url: https://sandbox-api.example.com/fd/v1
    description: Sandbox

tags:
  - name: Accounts
  - name: Holders
  - name: Transactions
  - name: Interest Accrual
  - name: Interest Payout
  - name: Payout Accounts
  - name: Premature Closure
  - name: Maturity Instructions
  - name: Notices
  - name: Statements
  - name: Account Events
  - name: Reference Data (Internal Sync)
  - name: Master Data

paths:

  # ============ ACCOUNTS ============
  /accounts:
    post:
      tags: [Accounts]
      summary: Open a new FD account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Accounts]
      summary: Search / list FD accounts
      operationId: listAccounts
      parameters:
        - name: holder_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, MATURED, CLOSED, PREMATURELY_CLOSED]
        - name: product_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get FD account details
      operationId: getAccount
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      summary: Update mutable account instructions (e.g. auto_renewal)
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{accountId}/activate:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      summary: Activate a pending FD account (post-funding)
      operationId: activateAccount
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          description: Invalid state transition

  /accounts/{accountId}/mature:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      summary: Trigger maturity processing for an account
      operationId: matureAccount
      responses:
        '200':
          description: Maturity processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{accountId}/renew:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      summary: Renew a matured FD account per maturity instructions
      operationId: renewAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                renewal_tenure_months: { type: integer }
      responses:
        '201':
          description: New (renewed) account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{accountId}/close:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      summary: Close account normally (at/after maturity)
      operationId: closeAccount
      responses:
        '200':
          description: Account closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  # ============ HOLDERS ============
  /accounts/{accountId}/holders:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Holders]
      summary: List account holders / roles
      operationId: listAccountHolders
      responses:
        '200':
          description: List of holders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountHolderRole'
    post:
      tags: [Holders]
      summary: Add a holder (joint holder, nominee, mandate)
      operationId: addAccountHolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountHolderRequest'
      responses:
        '201':
          description: Holder added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolderRole'

  /accounts/{accountId}/holders/{holderRoleId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: holderRoleId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Holders]
      summary: Update holder role / operating mandate
      operationId: updateAccountHolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountHolderRequest'
      responses:
        '200':
          description: Holder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolderRole'
    delete:
      tags: [Holders]
      summary: Remove a holder from account
      operationId: removeAccountHolder
      responses:
        '204':
          description: Holder removed

  # ============ TRANSACTIONS ============
  /accounts/{accountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Transactions]
      summary: Post a ledger transaction (deposit, interest credit, payout debit, closure debit)
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
    get:
      tags: [Transactions]
      summary: Get transaction history for account
      operationId: listTransactions
      parameters:
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: txn_type_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /transaction-types:
    get:
      tags: [Master Data]
      summary: List transaction type master data
      operationId: listTransactionTypes
      responses:
        '200':
          description: Transaction types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionType'

  # ============ INTEREST ACCRUAL ============
  /accounts/{accountId}/accrual/run:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Interest Accrual]
      summary: Run (trigger) interest accrual for an account (idempotent per accrual_date)
      operationId: runAccrual
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accrual_date: { type: string, format: date }
      responses:
        '200':
          description: Accrual result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAccrual'

  /accounts/{accountId}/accrual:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Interest Accrual]
      summary: Get accrual history
      operationId: listAccrual
      responses:
        '200':
          description: Accrual history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestAccrual'

  /accounts/{accountId}/accrual/cumulative:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Interest Accrual]
      summary: Get current cumulative accrued interest
      operationId: getCumulativeAccrual
      responses:
        '200':
          description: Cumulative accrued interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: integer }
                  cumulative_accrued: { type: number, format: double }
                  as_of_date: { type: string, format: date }

  # ============ PAYOUT ACCOUNTS ============
  /accounts/{accountId}/payout-accounts:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Payout Accounts]
      summary: List registered payout bank accounts
      operationId: listPayoutAccounts
      responses:
        '200':
          description: Payout accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutAccount'
    post:
      tags: [Payout Accounts]
      summary: Register a payout bank account
      operationId: createPayoutAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutAccountRequest'
      responses:
        '201':
          description: Payout account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'

  /accounts/{accountId}/payout-accounts/{payoutAccountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: payoutAccountId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Payout Accounts]
      summary: Update payout account (e.g. set as primary)
      operationId: updatePayoutAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_primary: { type: boolean }
                is_verified: { type: boolean }
      responses:
        '200':
          description: Updated payout account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'

  # ============ INTEREST PAYOUT ============
  /accounts/{accountId}/payouts/run:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Interest Payout]
      summary: Trigger a scheduled interest payout run
      operationId: runPayout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout_date: { type: string, format: date }
      responses:
        '200':
          description: Payout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPayout'

  /accounts/{accountId}/payouts:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Interest Payout]
      summary: Get payout history / status
      operationId: listPayouts
      responses:
        '200':
          description: Payout history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestPayout'

  # ============ PREMATURE CLOSURE ============
  /accounts/{accountId}/premature-closure:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Premature Closure]
      summary: Request premature closure (computes penalty via rule engine)
      operationId: requestPrematureClosure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrematureClosureRequest'
      responses:
        '201':
          description: Premature closure request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrematureClosure'
    get:
      tags: [Premature Closure]
      summary: Get premature closure request(s) for account
      operationId: getPrematureClosure
      responses:
        '200':
          description: Premature closure record(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrematureClosure'

  /accounts/{accountId}/premature-closure/{closureId}/approve:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: closureId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Premature Closure]
      summary: Approve a pending premature closure request
      operationId: approvePrematureClosure
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approved_by: { type: string }
      responses:
        '200':
          description: Premature closure approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrematureClosure'

  # ============ MATURITY INSTRUCTIONS ============
  /accounts/{accountId}/maturity-instructions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Maturity Instructions]
      summary: Get maturity instructions
      operationId: getMaturityInstructions
      responses:
        '200':
          description: Maturity instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturityInstruction'
    post:
      tags: [Maturity Instructions]
      summary: Set maturity instructions (renew / payout / sweep)
      operationId: createMaturityInstructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaturityInstructionRequest'
      responses:
        '201':
          description: Maturity instruction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturityInstruction'
    patch:
      tags: [Maturity Instructions]
      summary: Update maturity instructions
      operationId: updateMaturityInstructions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaturityInstructionRequest'
      responses:
        '200':
          description: Updated maturity instruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturityInstruction'

  # ============ NOTICES ============
  /accounts/{accountId}/notices:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Notices]
      summary: Generate a notice (maturity reminder, renewal notice)
      operationId: createNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoticeRequest'
      responses:
        '201':
          description: Notice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
    get:
      tags: [Notices]
      summary: List notices for account
      operationId: listNotices
      responses:
        '200':
          description: Notice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notice'

  # ============ STATEMENTS ============
  /accounts/{accountId}/statements:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Statements]
      summary: Generate a statement for a period
      operationId: createStatement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatementRequest'
      responses:
        '201':
          description: Statement generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
    get:
      tags: [Statements]
      summary: List statements for account
      operationId: listStatements
      responses:
        '200':
          description: Statement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Statement'

  /accounts/{accountId}/statements/{statementId}/download:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: statementId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Statements]
      summary: Download statement file
      operationId: downloadStatement
      responses:
        '200':
          description: Statement file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ============ ACCOUNT EVENTS ============
  /accounts/{accountId}/events:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Account Events]
      summary: Get account event / audit trail
      operationId: listAccountEvents
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: is_published
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountEvent'
    post:
      tags: [Account Events]
      summary: (Internal) Record a system-generated account event
      operationId: createAccountEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountEventRequest'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEvent'

  # ============ INTERNAL REFERENCE DATA SYNC ============
  /internal/sync/product:
    post:
      tags: [Reference Data (Internal Sync)]
      summary: Consume ProductCreated/ProductUpdated event from Product Service
      operationId: syncProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRefSyncEvent'
      responses:
        '204':
          description: Synced

  /internal/sync/currency:
    post:
      tags: [Reference Data (Internal Sync)]
      summary: Consume CurrencyUpdated event from Product Service
      operationId: syncCurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyRefSyncEvent'
      responses:
        '204':
          description: Synced

  /internal/sync/user:
    post:
      tags: [Reference Data (Internal Sync)]
      summary: Consume UserProfileUpdated event from User Service
      operationId: syncUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRefSyncEvent'
      responses:
        '204':
          description: Synced

  /internal/sync/role-type:
    post:
      tags: [Reference Data (Internal Sync)]
      summary: Consume RoleTypeUpdated event from Product Service
      operationId: syncRoleType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleTypeRefSyncEvent'
      responses:
        '204':
          description: Synced

  /internal/sync/rule-outcome:
    post:
      tags: [Reference Data (Internal Sync)]
      summary: Consume RuleOutcomeUpdated event from Product Service
      operationId: syncRuleOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleOutcomeRefSyncEvent'
      responses:
        '204':
          description: Synced

  /ref/products:
    get:
      tags: [Reference Data (Internal Sync)]
      summary: List locally cached product reference data
      operationId: listRefProducts
      responses:
        '200':
          description: Product refs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductRef'

  /ref/currencies:
    get:
      tags: [Reference Data (Internal Sync)]
      summary: List locally cached currency reference data
      operationId: listRefCurrencies
      responses:
        '200':
          description: Currency refs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyRef'

  /ref/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Reference Data (Internal Sync)]
      summary: Get locally cached user reference data
      operationId: getRefUser
      responses:
        '200':
          description: User ref
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRef'

  /ref/role-types:
    get:
      tags: [Reference Data (Internal Sync)]
      summary: List locally cached role type reference data
      operationId: listRefRoleTypes
      responses:
        '200':
          description: Role type refs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleTypeRef'

  /ref/rule-outcomes:
    get:
      tags: [Reference Data (Internal Sync)]
      summary: List locally cached rule outcome reference data
      operationId: listRefRuleOutcomes
      responses:
        '200':
          description: Rule outcome refs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleOutcomeRef'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer }
      description: fa_account_id

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_records: { type: integer }

    # ---------- Accounts ----------
    CreateAccountRequest:
      type: object
      required: [product_id, currency_id, principal_amount, tenure_months, interest_rate]
      properties:
        product_id: { type: integer }
        currency_id: { type: integer }
        applied_rate_outcome_id: { type: integer }
        principal_amount: { type: number, format: double }
        tenure_months: { type: integer }
        interest_rate: { type: number, format: double }
        compounding_frequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, ANNUALLY, AT_MATURITY]
        payout_frequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, ANNUALLY, AT_MATURITY, NONE]
        auto_renewal: { type: boolean }
        open_date: { type: string, format: date }

    UpdateAccountRequest:
      type: object
      properties:
        auto_renewal: { type: boolean }

    Account:
      type: object
      properties:
        account_id: { type: integer }
        account_number: { type: string }
        primary_holder_id: { type: integer }
        product_id: { type: integer }
        applied_rate_outcome_id: { type: integer }
        principal_amount: { type: number, format: double }
        currency_id: { type: integer }
        tenure_months: { type: integer }
        interest_rate: { type: number, format: double }
        compounding_frequency: { type: string }
        payout_frequency: { type: string }
        auto_renewal: { type: boolean }
        open_date: { type: string, format: date }
        maturity_date: { type: string, format: date }
        maturity_amount: { type: number, format: double }
        status: { type: string }
        created_by: { type: string }
        created_date: { type: string, format: date-time }
        updated_by: { type: string }
        updated_date: { type: string, format: date-time }
        version: { type: string }
        uuid: { type: string }

    # ---------- Holders ----------
    CreateAccountHolderRequest:
      type: object
      required: [user_id, role_type_id]
      properties:
        user_id: { type: integer }
        role_type_id: { type: integer }
        holder_sequence: { type: integer }
        operating_mandate: { type: string }
        tds_applicable: { type: boolean }

    UpdateAccountHolderRequest:
      type: object
      properties:
        role_type_id: { type: integer }
        operating_mandate: { type: string }
        tds_applicable: { type: boolean }

    AccountHolderRole:
      type: object
      properties:
        ahr_id: { type: integer }
        account_id: { type: integer }
        user_id: { type: integer }
        role_type_id: { type: integer }
        holder_sequence: { type: integer }
        operating_mandate: { type: string }
        tds_applicable: { type: boolean }
        created_date: { type: string, format: date-time }

    # ---------- Transactions ----------
    CreateTransactionRequest:
      type: object
      required: [txn_type_id, amount, txn_date, currency_id]
      properties:
        txn_type_id: { type: integer }
        amount: { type: number, format: double }
        txn_date: { type: string, format: date-time }
        currency_id: { type: integer }
        remarks: { type: string }

    Transaction:
      type: object
      properties:
        transaction_id: { type: integer }
        account_id: { type: integer }
        txn_type_id: { type: integer }
        amount: { type: number, format: double }
        txn_date: { type: string, format: date-time }
        balance_after: { type: number, format: double }
        currency_id: { type: integer }
        remarks: { type: string }
        created_date: { type: string, format: date-time }

    TransactionType:
      type: object
      properties:
        txn_type_id: { type: integer }
        txn_type_code: { type: string }
        txn_type_name: { type: string }
        debit_credit: { type: string, enum: [DEBIT, CREDIT] }
        requires_approval: { type: boolean }

    # ---------- Interest Accrual ----------
    InterestAccrual:
      type: object
      properties:
        accrual_id: { type: integer }
        account_id: { type: integer }
        accrual_date: { type: string, format: date }
        accrued_amount: { type: number, format: double }
        cumulative_accrued: { type: number, format: double }
        currency_id: { type: integer }
        created_date: { type: string, format: date-time }

    # ---------- Payout Accounts ----------
    CreatePayoutAccountRequest:
      type: object
      required: [bank_account_number, ifsc_code, account_holder_name]
      properties:
        bank_account_number: { type: string }
        ifsc_code: { type: string }
        account_holder_name: { type: string }
        is_primary: { type: boolean }

    PayoutAccount:
      type: object
      properties:
        payout_account_id: { type: integer }
        account_id: { type: integer }
        bank_account_number: { type: string }
        ifsc_code: { type: string }
        account_holder_name: { type: string }
        is_primary: { type: boolean }
        is_verified: { type: boolean }
        created_date: { type: string, format: date-time }

    # ---------- Interest Payout ----------
    InterestPayout:
      type: object
      properties:
        payout_id: { type: integer }
        account_id: { type: integer }
        payout_date: { type: string, format: date }
        amount: { type: number, format: double }
        currency_id: { type: integer }
        payout_status:
          type: string
          enum: [PENDING, PROCESSED, FAILED]
        created_date: { type: string, format: date-time }

    # ---------- Premature Closure ----------
    CreatePrematureClosureRequest:
      type: object
      required: [reason, currency_id]
      properties:
        reason: { type: string }
        currency_id: { type: integer }

    PrematureClosure:
      type: object
      properties:
        closure_id: { type: integer }
        account_id: { type: integer }
        closure_date: { type: string, format: date }
        penalty_pct_applied: { type: number, format: double }
        penalty_amount: { type: number, format: double }
        net_payable_amount: { type: number, format: double }
        currency_id: { type: integer }
        reason: { type: string }
        applied_rule_outcome_id: { type: integer }
        approved_by: { type: string }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, COMPLETED]
        created_date: { type: string, format: date-time }

    # ---------- Maturity Instructions ----------
    CreateMaturityInstructionRequest:
      type: object
      required: [instruction_type]
      properties:
        instruction_type:
          type: string
          enum: [RENEW_PRINCIPAL, RENEW_PRINCIPAL_AND_INTEREST, PAYOUT, SWEEP]
        renewal_tenure_months: { type: integer }
        target_payout_account_id: { type: integer }

    MaturityInstruction:
      type: object
      properties:
        instruction_id: { type: integer }
        account_id: { type: integer }
        instruction_type: { type: string }
        renewal_tenure_months: { type: integer }
        target_payout_account_id: { type: integer }
        created_date: { type: string, format: date-time }
        updated_date: { type: string, format: date-time }

    # ---------- Notices ----------
    CreateNoticeRequest:
      type: object
      required: [notice_type, channel]
      properties:
        notice_type:
          type: string
          enum: [MATURITY_REMINDER, RENEWAL_NOTICE, CLOSURE_CONFIRMATION]
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH, POST]

    Notice:
      type: object
      properties:
        notice_id: { type: integer }
        account_id: { type: integer }
        notice_type: { type: string }
        notice_date: { type: string, format: date-time }
        channel: { type: string }
        delivery_status:
          type: string
          enum: [PENDING, SENT, FAILED]
        created_date: { type: string, format: date-time }

    # ---------- Statements ----------
    CreateStatementRequest:
      type: object
      required: [period_start, period_end]
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }

    Statement:
      type: object
      properties:
        statement_id: { type: integer }
        account_id: { type: integer }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        generated_date: { type: string, format: date-time }
        file_reference: { type: string }

    # ---------- Account Events ----------
    CreateAccountEventRequest:
      type: object
      required: [event_type, payload]
      properties:
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
        is_published: { type: boolean }

    AccountEvent:
      type: object
      properties:
        event_id: { type: integer }
        account_id: { type: integer }
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
        is_published: { type: boolean }
        created_date: { type: string, format: date-time }

    # ---------- Reference Data Sync Events ----------
    ProductRefSyncEvent:
      type: object
      properties:
        product_id: { type: integer }
        product_code: { type: string }
        product_name: { type: string }
        status: { type: string }

    ProductRef:
      allOf:
        - $ref: '#/components/schemas/ProductRefSyncEvent'
        - type: object
          properties:
            synced_at: { type: string, format: date-time }

    CurrencyRefSyncEvent:
      type: object
      properties:
        currency_id: { type: integer }
        iso_code: { type: string }
        currency_name: { type: string }
        decimal_places: { type: integer }

    CurrencyRef:
      allOf:
        - $ref: '#/components/schemas/CurrencyRefSyncEvent'
        - type: object
          properties:
            synced_at: { type: string, format: date-time }

    UserRefSyncEvent:
      type: object
      properties:
        user_id: { type: integer }
        user_uuid: { type: string }
        customer_number: { type: string }
        full_name: { type: string }
        user_status: { type: string }

    UserRef:
      allOf:
        - $ref: '#/components/schemas/UserRefSyncEvent'
        - type: object
          properties:
            synced_at: { type: string, format: date-time }

    RoleTypeRefSyncEvent:
      type: object
      properties:
        role_type_id: { type: integer }
        role_code: { type: string }
        description: { type: string }

    RoleTypeRef:
      allOf:
        - $ref: '#/components/schemas/RoleTypeRefSyncEvent'
        - type: object
          properties:
            synced_at: { type: string, format: date-time }

    RuleOutcomeRefSyncEvent:
      type: object
      properties:
        outcome_id: { type: integer }
        outcome_type: { type: string }
        outcome_value: { type: string }
        unit: { type: string }

    RuleOutcomeRef:
      allOf:
        - $ref: '#/components/schemas/RuleOutcomeRefSyncEvent'
        - type: object
          properties:
            synced_at: { type: string, format: date-time }
