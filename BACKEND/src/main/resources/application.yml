server:
  port: 8080

spring:
  application:
    name: MoneyPal Fixed Deposit System
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Custom Application Security & JWT Properties
app:
  user-service:
    base-url: ${USER_SERVICE_URL:https://localhost:8081}
    service-token: ${USER_SERVICE_SERVICE_TOKEN:replace-with-signed-service-token}
    timeout-ms: ${USER_SERVICE_TIMEOUT_MS:2000}
    max-retries: ${USER_SERVICE_MAX_RETRIES:2}
    failure-threshold: ${USER_SERVICE_FAILURE_THRESHOLD:3}
    open-duration-ms: ${USER_SERVICE_OPEN_DURATION_MS:30000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 Hours

# Actuator Config for Liveliness & Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/login-service-openapi.yaml
    disable-swagger-default-url: true

fd:
  policy:
    authority: "academic fixed policy"
    version: academic-v1
    rate-unit: DECIMAL_FRACTION
    day-count-convention: ACTUAL_365
    currency-scale: 2
    display-scale: 2
    rounding-mode: HALF_UP
    opening-date-included: true
    maturity-date-included: false
    business-zone: UTC
  integration:
    actor-authority: "local /api/auth identity"
    product-terms-authority: "existing normalized server-owned product/rule tables"
