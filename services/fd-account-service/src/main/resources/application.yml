server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: fd-account-service
  datasource:
    url: ${FD_DB_URL}
    username: ${FD_DB_USERNAME}
    password: ${FD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/service-migration/fd
    baseline-on-migrate: ${FD_FLYWAY_BASELINE:false}
    baseline-version: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: ""
    listener:
      ack-mode: manual
app:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  demo-clock:
    business-zone: ${FD_BUSINESS_ZONE:UTC}
  fd:
    batch:
      schedule:
        enabled: ${FD_BATCH_SCHEDULE_ENABLED:false}
        interest-cron: ${FD_BATCH_INTEREST_CRON:0 0 0 * * *}
        maturity-cron: ${FD_BATCH_MATURITY_CRON:0 0 1 * * *}
        zone: ${FD_BATCH_ZONE:UTC}
  savings:
    interest:
      credit-frequency: ${SAVINGS_INTEREST_CREDIT_FREQUENCY:MONTHLY}
      schedule:
        cron: ${SAVINGS_INTEREST_CRON:0 10 0 * * *}
  demo:
    opening-balance:
      enabled: ${APP_DEMO_OPENING_BALANCE_ENABLED:false}
    opening-max-amount: ${APP_DEMO_OPENING_MAX_AMOUNT:}
  mpin:
    required: ${APP_MPIN_REQUIRED:true}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  forex:
    reference-rates: ${APP_FOREX_REFERENCE_RATES:INR/USD=83.25}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
  info.env.enabled: false
