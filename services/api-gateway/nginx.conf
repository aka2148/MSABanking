server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity_backend identity-customer-service:8081;
    set $product_backend product-service:8082;
    set $fd_backend fd-account-service:8083;

    set $allowed_origin "";
    if ($http_origin ~* ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$) { set $allowed_origin $http_origin; }
    add_header Access-Control-Allow-Origin $allowed_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-MPIN-Proof, X-Requested-With, Accept" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /gateway/health {
        auth_request /_gateway_health/fd;
        proxy_pass http://$fd_backend/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /_gateway_health/fd {
        internal;
        auth_request /_gateway_health/product;
        proxy_pass http://$fd_backend/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /_gateway_health/product {
        internal;
        auth_request /_gateway_health/identity;
        proxy_pass http://$product_backend/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /_gateway_health/identity {
        internal;
        proxy_pass http://$identity_backend/actuator/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /api/v1/auth { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/auth/ { proxy_pass http://$identity_backend; }
    location = /auth { proxy_pass http://$identity_backend; }
    location ^~ /auth/ { proxy_pass http://$identity_backend; }
    location = /api/v1/customers { proxy_pass http://$identity_backend; }
    location = /api/v1/customers/me/kyc/document {
        client_max_body_size 6m;
        proxy_pass http://$identity_backend;
    }
    location ^~ /api/v1/customers/ { proxy_pass http://$identity_backend; }
    location = /api/v1/users { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/users/ { proxy_pass http://$identity_backend; }
    location = /api/v1/roles { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/roles/ { proxy_pass http://$identity_backend; }
    location = /api/v1/branches { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/branches/ { proxy_pass http://$identity_backend; }
    location = /api/v1/employees { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/employees/ { proxy_pass http://$identity_backend; }
    location = /api/v1/customer-classification-types { proxy_pass http://$identity_backend; }
    location ^~ /api/v1/customer-classification-types/ { proxy_pass http://$identity_backend; }

    location = /api/product { proxy_pass http://$product_backend; }
    location ^~ /api/product/ { proxy_pass http://$product_backend; }
    location = /api/v1/products { proxy_pass http://$product_backend; }
    location ^~ /api/v1/products/ { proxy_pass http://$product_backend; }
    location = /api/v1/customer-products { proxy_pass http://$product_backend; }
    location ^~ /api/v1/customer-products/ { proxy_pass http://$product_backend; }
    location = /api/v1/fd-products { proxy_pass http://$product_backend; }
    location ^~ /api/v1/fd-products/ { proxy_pass http://$product_backend; }
    location = /api/v1/compliance/fd { proxy_pass http://$product_backend; }
    location ^~ /api/v1/compliance/fd/ { proxy_pass http://$product_backend; }
    location = /api/v1/currencies { proxy_pass http://$product_backend; }
    location ^~ /api/v1/currencies/ { proxy_pass http://$product_backend; }
    location = /api/v1/currencies/ { proxy_pass http://$product_backend; }
    location ^~ /api/v1/product-configurations/ { proxy_pass http://$product_backend; }
    location = /api/v1/product-configurations { proxy_pass http://$product_backend; }
    location ^~ /api/v1/product-categories/ { proxy_pass http://$product_backend; }
    location = /api/v1/product-categories { proxy_pass http://$product_backend; }

    location = /api/v1/savings-accounts { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/savings-accounts/ { proxy_pass http://$fd_backend; }
    location = /api/v1/loans { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/loans/ { proxy_pass http://$fd_backend; }
    location = /api/v1/admin/loans { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/admin/loans/ { proxy_pass http://$fd_backend; }
    location = /api/v1/admin/ledger { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/admin/ledger/ { proxy_pass http://$fd_backend; }
    location = /api/v1/forex-quote { proxy_pass http://$fd_backend; }
    location = /api/v1/forex-requests { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/forex-requests/ { proxy_pass http://$fd_backend; }
    location = /api/v1/fixed-deposits { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/fixed-deposits/ { proxy_pass http://$fd_backend; }
    location = /api/v1/admin/fixed-deposits/accrual-batch { proxy_pass http://$fd_backend; }
    location = /api/v1/admin/fixed-deposits/maturity-batch { proxy_pass http://$fd_backend; }
    location ^~ /api/v1/admin/fixed-deposits/ { proxy_pass http://$fd_backend; }
    location = /api/admin/clock { proxy_pass http://$fd_backend; }
    location ^~ /api/admin/clock/ { proxy_pass http://$fd_backend; }
    location = /fd/v1/staff { proxy_pass http://$fd_backend; }
    location ^~ /fd/v1/staff/ { proxy_pass http://$fd_backend; }

    location = /api/reports { proxy_pass http://$fd_backend; }
    location ^~ /api/reports/ { proxy_pass http://$fd_backend; }
    location = /api/calculator/estimate { proxy_pass http://$fd_backend; }

    location / {
        return 404 '{"message":"No service route is configured for this path."}';
        default_type application/json;
    }
}
