name: moneypal-demo

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  customer-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moneypal_customer
      MYSQL_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - customer-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  product-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moneypal_product
      MYSQL_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  fd-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moneypal_fd
      MYSQL_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3309:3306"
    volumes:
      - fd-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  identity-customer-service:
    build:
      context: .
      dockerfile: services/identity-customer-service/Dockerfile
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CUSTOMER_DB_URL: ${CUSTOMER_DB_URL:-jdbc:mysql://customer-db:3306/moneypal_customer?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      CUSTOMER_DB_USERNAME: ${CUSTOMER_DB_USERNAME:-${MYSQL_APP_USER}}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-${MYSQL_APP_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-${JWT_SECRET}}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-false}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-no-reply@localhost}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:4200/reset-password?token=}
      PASSWORD_RESET_API_URL: ${PASSWORD_RESET_API_URL:-https://api.brevo.com/v3/smtp/email}
      PASSWORD_RESET_API_KEY: ${PASSWORD_RESET_API_KEY:-}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PRODUCT_DB_URL: ${PRODUCT_DB_URL:-jdbc:mysql://product-db:3306/moneypal_product?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME:-${MYSQL_APP_USER}}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-${MYSQL_APP_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    restart: unless-stopped

  fd-account-service:
    build:
      context: .
      dockerfile: services/fd-account-service/Dockerfile
    depends_on:
      fd-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FD_DB_URL: ${FD_DB_URL:-jdbc:mysql://fd-db:3306/moneypal_fd?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      FD_DB_USERNAME: ${FD_DB_USERNAME:-${MYSQL_APP_USER}}
      FD_DB_PASSWORD: ${FD_DB_PASSWORD:-${MYSQL_APP_PASSWORD}}
      PRODUCT_SERVICE_URL: http://product-service:8082
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_DEMO_OPENING_BALANCE_ENABLED: ${APP_DEMO_OPENING_BALANCE_ENABLED:-false}
      APP_DEMO_OPENING_MAX_AMOUNT: ${APP_DEMO_OPENING_MAX_AMOUNT:-}
    ports:
      - "8083:8083"
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: banking-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "8084:8080"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    image: moneypal-demo-api-gateway
    depends_on:
      identity-customer-service:
        condition: service_started
      product-service:
        condition: service_started
      fd-account-service:
        condition: service_started
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/gateway/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    image: moneypal-demo-frontend
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/index.html >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  kafka-data:
  customer-db-data:
  product-db-data:
  fd-db-data:
