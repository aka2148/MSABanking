<app-glass-shell backgroundUrl="/world-map.png" align="right" [focalX]="71.9" [focalY]="42.0">
  <section class="glass-card recovery-card" aria-labelledby="recovery-title">
    <h2 id="recovery-title">{{ stepLabels[step] | translate }}</h2>
    <ol class="recovery-steps" [attr.aria-label]="'Password recovery steps' | translate">
      <li [class.active]="step === 'identifier'" [class.complete]="step === 'code' || step === 'password' || step === 'done'" [attr.aria-current]="step === 'identifier' ? 'step' : null">1</li>
      <li [class.active]="step === 'code'" [class.complete]="step === 'password' || step === 'done'" [attr.aria-current]="step === 'code' ? 'step' : null">2</li>
      <li [class.active]="step === 'password' || step === 'done'" [attr.aria-current]="step === 'password' || step === 'done' ? 'step' : null">3</li>
    </ol>

    <p class="glass-error" *ngIf="errorMessage" role="alert" aria-live="assertive">{{ errorMessage | translate }}</p>

    <form *ngIf="step === 'identifier'" [formGroup]="identifierForm" (ngSubmit)="sendCode()" novalidate>
      <label class="glass-field">
        <span class="glass-field__label">{{ 'Mobile number or username' | translate }}</span>
        <input #identifierInput type="text" formControlName="identifier" autocomplete="username" placeholder="9876543210" [attr.aria-invalid]="identifierForm.controls.identifier.touched && identifierForm.controls.identifier.invalid" />
        <span class="glass-field__error" *ngIf="identifierForm.controls.identifier.touched && identifierForm.controls.identifier.invalid" role="alert">{{ 'This field is required.' | translate }}</span>
      </label>
      <button type="submit" class="glass-btn glass-btn--full" [disabled]="busy">{{ (busy ? 'Sending…' : 'Send code') | translate }}</button>
    </form>

    <form *ngIf="step === 'code'" [formGroup]="codeForm" (ngSubmit)="verifyCode()" novalidate>
      <p class="glass-card__sub" aria-live="polite">{{ neutralMessage | translate }}</p>
      <label class="glass-field">
        <span class="glass-field__label">{{ '6-digit verification code' | translate }}</span>
        <input #codeInput type="text" formControlName="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" [attr.aria-invalid]="codeForm.controls.code.touched && codeForm.controls.code.invalid" />
        <span class="glass-field__error" *ngIf="codeForm.controls.code.touched && codeForm.controls.code.invalid" role="alert">{{ 'Enter the 6-digit code from your email.' | translate }}</span>
      </label>
      <button type="submit" class="glass-btn glass-btn--full" [disabled]="busy">{{ (busy ? 'Verifying…' : 'Verify') | translate }}</button>
      <button type="button" class="glass-btn glass-btn--ghost glass-btn--full" (click)="resendCode()" [disabled]="busy || cooldownSeconds > 0">
        <ng-container *ngIf="cooldownSeconds > 0; else resendReady">{{ 'Send a new code in {0} seconds.' | translate: [cooldownSeconds] }}</ng-container>
        <ng-template #resendReady>{{ 'Send a new code' | translate }}</ng-template>
      </button>
      <button type="button" class="text-button" (click)="backToIdentifier()" [disabled]="busy">{{ 'Back' | translate }}</button>
    </form>

    <form *ngIf="step === 'password'" [formGroup]="passwordForm" (ngSubmit)="resetPassword()" novalidate>
      <label class="glass-field">
        <span class="glass-field__label">{{ 'New password' | translate }}</span>
        <input #newPasswordInput type="password" formControlName="newPassword" autocomplete="new-password" [attr.aria-invalid]="passwordForm.controls.newPassword.touched && (passwordForm.controls.newPassword.invalid || passwordIssues.length > 0)" />
        <span class="glass-field__error" *ngIf="passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.hasError('required')" role="alert">{{ 'Enter a new password.' | translate }}</span>
        <span class="glass-field__error" *ngIf="passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.hasError('maxlength')" role="alert">{{ 'Password cannot exceed 100 characters.' | translate }}</span>
        <span class="glass-field__error" *ngIf="passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.value && passwordIssues.length" role="alert">{{ passwordIssues[0] | translate }}</span>
      </label>
      <label class="glass-field">
        <span class="glass-field__label">{{ 'Confirm password' | translate }}</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" [attr.aria-invalid]="passwordForm.controls.confirmPassword.touched && (passwordForm.controls.confirmPassword.invalid || passwordsMismatch)" />
        <span class="glass-field__error" *ngIf="passwordForm.controls.confirmPassword.touched && passwordForm.controls.confirmPassword.hasError('required')" role="alert">{{ 'Confirm your password.' | translate }}</span>
        <span class="glass-field__error" *ngIf="passwordForm.controls.confirmPassword.touched && passwordsMismatch" role="alert">{{ 'Passwords don\'t match.' | translate }}</span>
      </label>
      <p class="glass-field__error" *ngIf="serverPasswordError" role="alert" aria-live="assertive">{{ serverPasswordError | translate }}</p>
      <button type="submit" class="glass-btn glass-btn--full" [disabled]="busy || passwordForm.invalid || passwordsMismatch || passwordIssues.length > 0">{{ (busy ? 'Resetting…' : 'Reset password and sign in') | translate }}</button>
    </form>

    <p class="glass-card__footer"><a routerLink="/login" class="glass-link">{{ 'Back to sign in' | translate }}</a></p>
  </section>
</app-glass-shell>
