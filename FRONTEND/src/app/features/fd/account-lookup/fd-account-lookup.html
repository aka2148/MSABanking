<app-glass-shell align="right" [focalX]="71.9" [focalY]="42.0">
  <main class="glass-card fd-lookup-card">
    <p class="fd-eyebrow">Your deposits</p>
    <h2>View my deposits</h2>
    <p class="glass-card__sub">Open a deposit using the account id you received after booking.</p>

    <p class="glass-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <form [formGroup]="form" (ngSubmit)="openAccount()" novalidate>
      <label class="glass-field">
        <span class="glass-field__label">FD account id</span>
        <input type="number" min="1" step="1" formControlName="accountId" inputmode="numeric" placeholder="Example: 1042" />
        <span class="glass-field__error" *ngIf="form.controls.accountId.touched && form.controls.accountId.invalid">
          Use a positive numeric account id.
        </span>
      </label>

      <button type="submit" class="glass-btn glass-btn--full" [disabled]="loading">
        {{ loading ? 'Opening…' : 'Open deposit' }}
      </button>
    </form>

    <p class="fd-lookup-note">Ownership is checked by the backend. No account totals are inferred here.</p>
    <p class="glass-card__footer"><a routerLink="/fd" class="glass-link">Back to FD products</a></p>
  </main>
</app-glass-shell>
