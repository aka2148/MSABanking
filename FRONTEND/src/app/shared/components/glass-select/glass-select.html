<div class="glass-select" [class.glass-select--open]="isOpen">
  <button #trigger type="button" class="glass-select__trigger" (click)="toggle()" [disabled]="disabled" [attr.aria-expanded]="isOpen" aria-haspopup="listbox">
    <svg class="glass-select__chevron" viewBox="0 0 20 20" fill="none">
      <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span [class.glass-select__placeholder]="!selectedValue">{{ translateOptions || !selectedValue ? (selectedLabel | translate) : selectedLabel }}</span>
  </button>

  <div #menu class="glass-select__menu" *ngIf="isOpen">
    <input
      class="glass-select__search"
      type="search"
      [value]="searchTerm"
      (input)="searchTerm = $any($event.target).value"
      [attr.aria-label]="'Search options' | translate"
      [placeholder]="'Search options...' | translate"
      autocomplete="off"
    />
    <button
      type="button"
      class="glass-select__option"
      *ngFor="let option of filteredOptions"
      [class.glass-select__option--selected]="option.value === selectedValue"
      [disabled]="option.disabled"
      (click)="select(option)"
    >{{ translateOptions ? (option.label | translate) : option.label }}</button>
    <p class="glass-select__empty" *ngIf="filteredOptions.length === 0">{{ 'No matching options' | translate }}</p>
  </div>
</div>
